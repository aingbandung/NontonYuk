name: Build APK

# Builds the single FermataX universal debug APK (phone + Android Auto) on every push
# to main, or on demand from the Actions tab, and publishes it as a GitHub Release so it
# can be downloaded straight to the phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NO_GS: true
      # Optional: base64 of a debug.keystore stored as a repository secret. With it every
      # build is signed with the same key, so a new APK installs over the previous one.
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Use the stable debug signing key
        if: ${{ env.DEBUG_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build universal APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew build.sh
          ./build.sh -d
          mapfile -t apks < <(find dist -maxdepth 1 -type f -name 'FermataX-*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one universal APK, found ${#apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" dist/FermataX-YTMusic-debug-universal.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FermataX-YTMusic-${{ github.run_number }}
          path: dist/FermataX-YTMusic-debug-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FermataX + YT Music (build ${{ github.run_number }})
          body: |
            Universal debug APK for phone and Android Auto, built from ${{ github.sha }}.
            Install with KingInstaller ("Install as King"), then enable "Debug fermataX"
            in Android Auto > Customise Launcher.
          files: dist/FermataX-YTMusic-debug-universal.apk
          make_latest: true
